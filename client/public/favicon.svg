<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB400" />
      <stop offset="100%" stop-color="#E09600" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C2C16" />
      <stop offset="100%" stop-color="#3A1708" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#121212" stroke="#FFB400" stroke-width="3"/>
  <!-- Top Bun -->
  <path d="M 22 42 A 28 26 0 0 1 78 42 Z" fill="url(#bunGrad)"/>
  <!-- Sesame seeds -->
  <ellipse cx="38" cy="28" rx="2" ry="1.2" fill="#FFF2CC" transform="rotate(-15 38 28)"/>
  <ellipse cx="50" cy="24" rx="2" ry="1.2" fill="#FFF2CC"/>
  <ellipse cx="62" cy="28" rx="2" ry="1.2" fill="#FFF2CC" transform="rotate(15 62 28)"/>
  <!-- Lettuce -->
  <path d="M 20 45 Q 27 50 35 45 Q 43 41 50 46 Q 57 50 65 45 Q 73 41 80 45" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
  <!-- Cheese Slice -->
  <polygon points="25,50 75,50 68,57 45,53" fill="#FACC15"/>
  <!-- Burger Patty -->
  <rect x="22" y="53" width="56" height="12" rx="6" fill="url(#pattyGrad)"/>
  <!-- Bottom Bun -->
  <rect x="24" y="68" width="52" height="10" rx="5" fill="url(#bunGrad)"/>
</svg>
